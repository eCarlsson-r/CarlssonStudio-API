# App
spring.application.name=CarlssonStudio-API
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carlssonstudio_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# Internationalization — Accept-Language driven; see config/LocaleConfig
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# App config
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://carlssonstudio.com}
app.mail.notification-to=${MAIL_USERNAME}
app.mail.from=${MAIL_USERNAME}
app.mail.from-name=${MAIL_FROM_NAME:Carlsson Studio}

# Proposals
app.proposals.storage-path=${PROPOSALS_PATH:proposals}

# Meta Conversions API (server-side Lead event; pairs with the Pixel
# fired client-side using the same event_id for deduplication)
app.meta.enabled=${META_CAPI_ENABLED:false}
app.meta.pixel-id=${META_PIXEL_ID:}
app.meta.access-token=${META_CAPI_ACCESS_TOKEN:}
app.meta.api-version=${META_CAPI_API_VERSION:v20.0}
app.meta.event-source-url=${META_CAPI_EVENT_SOURCE_URL:https://carlssonstudio.com/start-a-project}
app.meta.test-event-code=${META_CAPI_TEST_EVENT_CODE:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}