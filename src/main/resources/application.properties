# App
spring.application.name=CarlssonStudio-API
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/carlssonstudio_db
spring.datasource.username=root
spring.datasource.password=BbC09!07
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# CORS
app.cors.allowed-origins=http://localhost:3000,https://carlssonstudio.com

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized