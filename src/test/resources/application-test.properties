# H2 in-memory DB in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create schema, disable Flyway (MySQL-specific SQL won't run on H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Dummy values so placeholders resolve
app.jwt.secret=TestSecretKeyForCIThatIsAtLeast32CharactersLong!
spring.mail.username=test@test.com
spring.mail.password=dummy
app.mail.notification-to=test@test.com
app.mail.from=test@test.com